  <text x="57" y="369" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11.5" fill="#676d71">旧版的 6 个错误都落在期望页的相邻页；逐页切块后偏移消失。新版另完成 35 题真实 API 全量评测：30/30 可答、5/5 拒答。</text>
  <text x="57" y="386" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11.5" fill="#676d71">两组版本同时改变了分块与查询策略，不能把 +20pp 全部归因于单一变量；下一阶段复核语义忠实度，并加入 Memory 与浏览器验证。</text>
